[package]
name = "chess"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
drawille = "0.3.0"
# env_logger = "0.10.1"
log = "0.4.20"
mockall = "0.13.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
ratatui = "0.30"
signal-hook = "0.4"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustix = { version = "1", features = ["event"] }

[dev-dependencies]
env_logger = "0.10.1"
mockall = "0.13.1"
proptest = "1"
criterion = "0.5"
insta = "1"

[[bench]]
name = "perft"
harness = false

[profile.dev.package.chess]
opt-level = 3

# The Image glyph style (src/tui/pieces.rs, src/tui/board.rs) leans on these crates for
# resizing, sixel encoding (icy_sixel quantises colours with quantette), PNG encoding and
# the base64 of Kitty and iTerm2 pictures (base64-simd, on vsimd): at the default
# opt-level 0 building one board's worth of pictures can stall the UI thread for seconds
# under `cargo run`. Optimise them in the dev profile too; a release build already pays
# only their optimised cost.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.ratatui-image]
opt-level = 3

[profile.dev.package.icy_sixel]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.quantette]
opt-level = 3

[profile.dev.package.base64-simd]
opt-level = 3

[profile.dev.package.vsimd]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.test]
build-override.debug = true

[env]
RUST_LOG = "debug"
